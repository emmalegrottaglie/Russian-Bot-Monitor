[project]
name = "bot-traffic-monitor"
version = "0.1.0"
description = "Tracks Yandex network health against activity in online political communities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracker", "tracker.collectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
