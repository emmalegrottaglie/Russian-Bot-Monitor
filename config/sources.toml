# What the collector watches. Edit freely; series are created from this file on start.
#
# kind = "infrastructure": network-level signals for the data centres themselves.
# kind = "community":      activity rates in online communities.
#
# Tags are the research grouping. They are a judgement call and are documented on
# the site's ABOUT tab, so keep them honest and keep a "control" group of
# non-political communities: a drop that also shows up in controls is not evidence
# of bot removal.
#
#   political-right  communities organised around right-wing politics
#   political-left   communities organised around left-wing politics
#   political        general political discussion
#   regional         country / state communities
#   russia           Russia-focused communities
#   south-america    South American country communities
#   control          non-political baseline

[analysis]
# Pre-strike window used for the "vs reference" comparison (UTC dates, inclusive).
reference_start = "2026-09-15"
reference_end = "2026-10-07"
# Series correlations are computed against this one by default.
correlation_ref = "ioda.asn200350.ping-slash24"

# ── Infrastructure ────────────────────────────────────────────────────────────

[[infrastructure]]
source = "ioda"
asn = 200350
name = "Yandex Cloud"
signals = ["ping-slash24", "bgp", "merit-nt"]

[[infrastructure]]
source = "ioda"
asn = 13238
name = "Yandex"
# IODA only publishes BGP visibility for this ASN; active probing covers AS200350.
signals = ["bgp"]

[[infrastructure]]
source = "cloudflare"
asn = 13238
name = "Yandex"

